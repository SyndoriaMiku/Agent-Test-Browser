[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-agent"
version = "0.1.0"
description = "Visual browser game AI agent"
requires-python = ">=3.14"
dependencies = ["playwright", "pydantic>=2", "python-dotenv"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m \"not browser and not live\""
markers = [
    "browser: real-browser tests (opt-in; run with -m browser)",
    "live: tests that call a real model API (opt-in; run with -m live)",
]
